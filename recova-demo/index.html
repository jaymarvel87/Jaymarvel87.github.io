<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recova — Media Rescue</title>
<meta name="description" content="Rescue photos, videos, voice notes and documents from a banned WhatsApp Business line. Media only, never chats. Classroom project.">
<meta name="theme-color" content="#075e54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recova">
<style>
:root{--rc-teal:#075e54;--rc-teal-2:#0e7c6c;--rc-mint:#e7f5f1;--rc-ink:#251f21;--rc-ink-2:#585254;--rc-ink-3:#969394;--rc-ink-4:#c0bebf;--rc-hairline:#eae9ea;--rc-raised:#f4efec;--rc-red:#ed313e;--rc-red-border:rgb(245 170 174);--rc-font-display:"Aime",Georgia,"Times New Roman",serif;--rc-font-text:"KMR Melange Grotesk",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#ece7e4;font-family:var(--rc-font-text);color:var(--rc-ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh;min-height:100dvh}
#app{width:100%;max-width:430px;background:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
@media (min-width:560px){body{padding:28px 0;align-items:flex-start}#app{min-height:0;border:1px solid var(--rc-hairline);border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgb(37 31 33 / 0.12)}}
.stage{display:flex;flex-direction:column;flex:1;animation:rc-in .45s cubic-bezier(.22,1,.36,1)}
@keyframes rc-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{background:var(--rc-teal);color:#fff;padding:48px 28px 38px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mark{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--rc-teal);border-radius:26%;font-family:var(--rc-font-display);font-weight:800;margin-bottom:10px}
.brand{font-family:var(--rc-font-display);font-size:30px;letter-spacing:-0.025em}
.tagline{font-size:14px;opacity:.85}
.body{padding:28px 24px 32px;display:flex;flex-direction:column;gap:16px;flex:1}
.center{align-items:center;text-align:center;justify-content:center}
.kicker{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rc-teal-2)}
.h1{margin:0;font-family:var(--rc-font-display);font-size:27px;line-height:1.2;letter-spacing:-0.025em}
.h2{margin:0;font-family:var(--rc-font-display);font-size:22px;line-height:1.25;letter-spacing:-0.025em}
.p{margin:0;font-size:14.5px;line-height:1.6;color:var(--rc-ink-2)}
.fine{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--rc-ink-3)}
.btn{appearance:none;border:none;cursor:pointer;background:var(--rc-teal);color:#fff;font:600 15px var(--rc-font-text);padding:15px 20px;border-radius:12px;width:100%;text-align:center;transition:transform .15s ease,background .15s ease;min-height:48px}
.btn:hover{background:var(--rc-teal-2)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.7;cursor:default}
.btn-ghost{background:#fff;color:var(--rc-teal);border:1.5px solid var(--rc-teal)}
.btn-ghost:hover{background:var(--rc-mint)}
.quiet{appearance:none;background:none;border:none;cursor:pointer;color:var(--rc-ink-2);font:500 13.5px var(--rc-font-text);padding:10px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.quiet:hover{color:var(--rc-ink)}
.ban{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--rc-red-border);border-radius:16px;padding:16px;background:#fff}
.ban.compact{align-items:center}
.ban-icon{flex:none;width:40px;height:40px;border-radius:50%;background:rgb(237 49 62 / .06);color:var(--rc-red);display:inline-flex;align-items:center;justify-content:center}
.ban-title{font:600 15px var(--rc-font-text);margin-bottom:4px}
.ban-sub{font-size:13px;line-height:1.5;color:var(--rc-ink-2)}
.plan{border:1px solid var(--rc-hairline);border-radius:16px;overflow:hidden}
.plan-row{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.plan-row+.plan-row{border-top:1px solid var(--rc-hairline)}
.plan-row b{font:600 14.5px var(--rc-font-text)}
.plan-row span{font-size:13px;color:var(--rc-ink-2)}
.receipt{position:relative;overflow:hidden;border:1px solid var(--rc-hairline);border-radius:16px;padding:20px;background:#fff;display:flex;flex-direction:column;gap:14px}
.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--rc-font-display);font-weight:800;font-size:92px;letter-spacing:.08em;color:rgb(7 94 84 / .07);transform:rotate(-24deg);pointer-events:none;user-select:none}
.receipt-head{display:flex;gap:12px;align-items:center}
.receipt-head b{display:block;font:600 14.5px var(--rc-font-text)}
.receipt-head span{font-size:12px;color:var(--rc-ink-3)}
.receipt-amount{font-family:var(--rc-font-display);font-size:44px;letter-spacing:-0.03em;text-align:center;padding:6px 0}
.receipt-rows{display:flex;flex-direction:column;border-top:1px dashed var(--rc-ink-4)}
.receipt-rows>div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px dashed var(--rc-ink-4);font-size:13px}
.receipt-rows span{color:var(--rc-ink-3);flex:none}
.receipt-rows b{font-weight:500;text-align:right}
.receipt-ok{color:var(--rc-teal-2)!important}
.receipt-note{font-size:11.5px;line-height:1.5;color:var(--rc-ink-3);text-align:center}
.pair-status{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--rc-ink-2);min-height:56px}
.paired{border:1px solid var(--rc-hairline);border-radius:16px;padding:16px}
.paired b{color:var(--rc-ink)}
.radar{position:relative;width:22px;height:22px;flex:none}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--rc-teal);animation:rc-radar 1.6s ease-out infinite}
.radar::after{animation-delay:.8s}
@keyframes rc-radar{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
.device{appearance:none;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--rc-teal);border-radius:16px;background:#fff;padding:14px 16px;min-height:56px;animation:rc-pop .5s cubic-bezier(.34,1.56,.64,1) both}
.device:hover{background:var(--rc-mint)}
.device-icon{flex:none;width:40px;height:40px;border-radius:12px;background:var(--rc-mint);color:var(--rc-teal);display:inline-flex;align-items:center;justify-content:center}
.device-meta{flex:1;display:flex;flex-direction:column;gap:2px}
.device-meta b{font:600 14.5px var(--rc-font-text)}
.device-meta span{font-size:12.5px;color:var(--rc-ink-2)}
.device-go{font:600 13px var(--rc-font-text);color:var(--rc-teal)}
.scanline{font:500 12.5px var(--rc-font-text);background:var(--rc-raised);border-radius:8px;padding:10px 12px;overflow:hidden;white-space:nowrap}
.scanline-text{display:inline-block;animation:rc-typing 2.2s steps(60,end) both;overflow:hidden;vertical-align:bottom;max-width:100%}
@keyframes rc-typing{from{max-width:0}to{max-width:100%}}
.bar{height:8px;border-radius:99px;background:var(--rc-raised);overflow:hidden;width:100%}
.bar-fill{display:block;height:100%;background:var(--rc-teal);border-radius:99px;transition:width .12s linear}
.counters{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--rc-ink-2)}
.counters b{color:var(--rc-ink);font-weight:600;font-variant-numeric:tabular-nums}
.counters-flat{padding-bottom:14px;border-bottom:1px solid var(--rc-hairline)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-big{grid-template-columns:repeat(3,1fr);gap:10px}
.tile{margin:0;position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--rc-raised);animation:rc-pop .5s cubic-bezier(.34,1.56,.64,1) both;display:flex;flex-direction:column}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile figcaption{font-size:10.5px;color:var(--rc-ink-2);padding:5px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-big .tile{aspect-ratio:auto}
.grid-big .tile img{aspect-ratio:1}
@keyframes rc-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.vid{position:absolute;left:6px;bottom:6px;display:inline-flex;align-items:center;gap:4px;background:rgb(0 0 0 / .72);color:#fff;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:99px}
.tile-doc{align-items:center;justify-content:center;gap:6px;border:1px solid var(--rc-hairline);background:#fff}
.doc-ext{font:600 11px var(--rc-font-text);color:var(--rc-teal);border:1.5px solid var(--rc-teal);border-radius:6px;padding:4px 7px}
.tile-doc figcaption{text-align:center;padding:0 6px 6px}
.tile-more{align-items:center;justify-content:center;background:var(--rc-mint);border:none}
.tile-more span{font-family:var(--rc-font-display);font-size:22px;color:var(--rc-teal)}
.tile-more figcaption{font-size:11px;color:var(--rc-teal-2)}
.found{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding-top:6px;animation:rc-in .5s ease both}
.found-title{font-family:var(--rc-font-display);font-size:19px;letter-spacing:-0.02em}
.check{width:44px;height:44px;display:inline-block}
.check-big{width:72px;height:72px}
.check svg{width:100%;height:100%}
.check-circle{stroke:var(--rc-teal);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:rc-draw .7s cubic-bezier(.65,0,.45,1) forwards}
.check-tick{stroke:var(--rc-teal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:rc-draw .45s .55s cubic-bezier(.65,0,.45,1) forwards}
@keyframes rc-draw{to{stroke-dashoffset:0}}
.savenum{font-family:var(--rc-font-display);font-size:52px;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.savenum span{font-size:22px;color:var(--rc-ink-3)}
.dest{display:flex;flex-direction:column;gap:10px}
.truth-group{display:flex;flex-direction:column;gap:8px}
.truth-label{font:600 14.5px var(--rc-font-text)}
.callout{border:1px solid var(--rc-red-border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.callout b{font:600 14px var(--rc-font-text);color:var(--rc-red)}
.callout span{font-size:13px;line-height:1.5;color:var(--rc-ink-2)}
.textlink{color:var(--rc-teal-2);font-weight:600}
.demo-foot{padding:14px 24px 22px;border-top:1px solid var(--rc-hairline);font-size:11.5px;line-height:1.5;color:var(--rc-ink-3)}
.mode-pick{display:flex;flex-direction:column;gap:10px}
.steps{display:flex;flex-direction:column;border:1px solid var(--rc-hairline);border-radius:16px;overflow:hidden}
.step{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.step+.step{border-top:1px solid var(--rc-hairline)}
.step-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--rc-mint);color:var(--rc-teal);font:600 13px var(--rc-font-text);display:inline-flex;align-items:center;justify-content:center}
.step-t{font-size:13.5px;line-height:1.5;color:var(--rc-ink-2)}
.step-t b{color:var(--rc-ink);font-weight:600}
.file-list{display:flex;flex-direction:column;border:1px solid var(--rc-hairline);border-radius:16px;overflow:hidden;max-height:260px;overflow-y:auto}
.file-row{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:13px}
.file-row+.file-row{border-top:1px solid var(--rc-hairline)}
.file-row .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file-row .fsize{color:var(--rc-ink-3);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.file-row .fthumb{flex:none;width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--rc-raised)}
.file-row .fdoc{flex:none;width:34px;height:34px;border-radius:8px;background:var(--rc-mint);color:var(--rc-teal);display:inline-flex;align-items:center;justify-content:center;font:600 9.5px var(--rc-font-text)}
.hidden-input{display:none}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="picker" class="hidden-input" multiple>
<input type="file" id="picker-dir" class="hidden-input" webkitdirectory multiple>
<script>
'use strict';
const TOTALS = { photos: 214, videos: 38, documents: 41, voice: 19 };
const TOTAL = TOTALS.photos + TOTALS.videos + TOTALS.documents + TOTALS.voice;
const MEDIA_TILES = [
    { src: 'photos/shop.jpg', label: 'Shop front.jpg', kind: 'photo' },
    { src: 'photos/rack.jpg', label: 'New arrivals.mp4', kind: 'video', dur: '0:42' },
    { src: 'photos/shirts.jpg', label: 'T-shirts batch.jpg', kind: 'photo' },
    { src: null, label: 'Invoice #1042.pdf', kind: 'doc', ext: 'PDF' },
    { src: 'photos/flatlay.jpg', label: 'Ankara set.jpg', kind: 'photo' },
    { src: 'photos/sneaker.jpg', label: 'Sneakers red.jpg', kind: 'photo' },
    { src: null, label: 'Price list.xlsx', kind: 'doc', ext: 'XLS' },
    { src: 'photos/tailor.jpg', label: 'Customer order.mp4', kind: 'video', dur: '1:05' },
    { src: 'photos/folded.jpg', label: 'Folded stock.jpg', kind: 'photo' },
    { src: null, label: 'Receipts - Aba.zip', kind: 'doc', ext: 'ZIP' },
    { src: 'photos/model1.jpg', label: 'Summer line.jpg', kind: 'photo' },
    { src: null, label: 'Delivery note.pdf', kind: 'doc', ext: 'PDF' },
];
const ease = p => 1 - Math.pow(1 - p, 3);
const app = document.getElementById('app');
let timers = [];
function clearTimers() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; }
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function every(fn, ms) { const t = setInterval(fn, ms); timers.push(t); return t; }
function fmtMB(bytes) { return (bytes / (1024 * 1024)).toFixed(2) + ' MB'; }
const CHECK = '<span class="check" aria-hidden="true"><svg viewBox="0 0 52 52"><circle class="check-circle" cx="26" cy="26" r="24" fill="none"/><path class="check-tick" fill="none" d="M14 27l8 8 16-17"/></svg></span>';
const CHECK_BIG = CHECK.replace('class="check"', 'class="check check-big"');
const MARK = s => '<span class="mark" style="width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s * 0.52) + 'px">R</span>';
const FOOT = '<div class="demo-foot">Recova rescues media files only: photos, videos, voice notes and documents already downloaded to a phone. It cannot recover chats or backups, and it cannot unban an account. Only WhatsApp can do that, through the Request review button in the app.</div>';
function go(stage) {
    clearTimers();
    const r = { welcome: renderWelcome, paywall: renderPaywall, receipt: renderReceipt, pair: renderPair, scan: renderScan, results: renderResults, saving: renderSaving, saved: renderSaved, truth: renderTruth, real: renderReal, dirscan: renderDirScan, zip: renderZip, zdone: renderZipDone };
    (r[stage] || renderWelcome)();
    window.scrollTo(0, 0);
}
let installPrompt = null;
let installedThisSession = false;
const standaloneQuery = window.matchMedia('(display-mode: standalone)');
function isInstalled() { return installedThisSession || standaloneQuery.matches || navigator.standalone === true; }
function refreshInstall() {
    const slot = document.getElementById('install-slot');
    if (slot) slot.hidden = isInstalled();
}
window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); installPrompt = e; refreshInstall();
});
window.addEventListener('appinstalled', () => {
    installedThisSession = true; installPrompt = null; refreshInstall();
});
if (standaloneQuery.addEventListener) standaloneQuery.addEventListener('change', refreshInstall);
async function installRecova() {
    const help = document.getElementById('install-help');
    if (installPrompt) {
        const prompt = installPrompt; installPrompt = null;
        try {
            await prompt.prompt();
            const choice = await prompt.userChoice;
            if (choice.outcome === 'accepted') {
                if (help) { help.hidden = false; help.textContent = 'Finish the installation in Chrome. Then open Recova from your home screen.'; }
                return;
            }
        } catch (e) { /* manual steps remain available */ }
    }
    if (help) { help.hidden = false; help.innerHTML = 'In Chrome, tap the three-dot menu &rsaquo; Install app or Add to Home screen, then confirm. If neither appears, open this page directly in Chrome and try again after it finishes loading.'; }
}
function renderWelcome() {
    app.innerHTML = '<div class="stage">'
        + '<div class="hero">' + MARK(56) + '<div class="brand">Recova</div><div class="tagline">Media rescue for banned WhatsApp Business lines</div></div>'
        + '<div class="body">'
        + '<h1 class="h1">Banned out of WhatsApp? The media is not gone.</h1>'
        + '<p class="p">A ban locks the chats, but every photo, video and document WhatsApp downloaded stays on that phone. Recova gathers them, organises them and zips them for safekeeping.</p>'
        + '<div id="install-slot"' + (isInstalled() ? ' hidden' : '') + '><button class="btn btn-ghost" id="b-install">Install Recova</button><p class="fine" id="install-help" hidden>In Chrome, tap the three-dot menu &rsaquo; Install app or Add to Home screen, then confirm. If neither appears, open this page directly in Chrome and try again after it finishes loading.</p></div>'
        + '<div class="mode-pick"><button class="btn" id="b-real">Run a real rescue</button><button class="btn btn-ghost" id="b-demo">Class demo (simulated)</button></div>'
        + '<button class="quiet" id="b-truth">What Recova can and can&rsquo;t do</button>'
        + '<p class="fine">Real rescue runs on the affected phone and touches only the files its owner selects. The class demo is fully simulated, including its $7 paywall.</p>'
        + '</div>' + FOOT + '</div>';
    document.getElementById('b-install').onclick = installRecova;
    document.getElementById('b-real').onclick = () => go('real');
    document.getElementById('b-demo').onclick = () => go('paywall');
    document.getElementById('b-truth').onclick = () => go('truth');
}
/* ---- real rescue ---- */
let picked = []; // {file, cat, url, path}
const FS_DIR = typeof window.showDirectoryPicker === 'function';
const FS_SAVE = typeof window.showSaveFilePicker === 'function';
const CATS = ['Images', 'Videos', 'Voice notes', 'Documents'];
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function catOf(f) {
    const t = (f.type || '').toLowerCase();
    if (t.startsWith('image/')) return 'Images';
    if (t.startsWith('video/')) return 'Videos';
    if (t.startsWith('audio/')) return 'Voice notes';
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if ('jpg jpeg png webp gif heic heif bmp'.split(' ').indexOf(ext) >= 0) return 'Images';
    if ('mp4 3gp mkv mov avi webm'.split(' ').indexOf(ext) >= 0) return 'Videos';
    if ('opus ogg mp3 m4a aac wav amr'.split(' ').indexOf(ext) >= 0) return 'Voice notes';
    return 'Documents';
}
function addFiles(list) {
    const seen = new Set(picked.map(p => (p.path || p.file.name) + ':' + p.file.size));
    let added = 0;
    Array.from(list).forEach(f => {
        const rel = f.webkitRelativePath || '';
        const k = (rel || f.name) + ':' + f.size;
        if (seen.has(k)) return;
        seen.add(k);
        picked.push({ file: f, cat: catOf(f), path: rel, url: (picked.length < 60 && f.type && f.type.startsWith('image/')) ? URL.createObjectURL(f) : '' });
        added++;
    });
    return added;
}
function renderReal() {
    const totalBytes = picked.reduce((a, p) => a + p.file.size, 0);
    const counts = { Images: 0, Videos: 0, 'Voice notes': 0, Documents: 0 };
    picked.forEach(p => counts[p.cat]++);
    const has = picked.length > 0;
    const previewRows = picked.slice(0, 60).map(p => {
        const ext = (p.file.name.split('.').pop() || 'file').slice(0, 4).toUpperCase();
        const thumb = (p.cat === 'Images' && p.url) ? '<img class="fthumb" src="' + p.url + '" alt="">' : '<span class="fdoc">' + esc(ext) + '</span>';
        return '<div class="file-row">' + thumb + '<span class="fname">' + esc(p.file.name) + '</span><span class="fsize">' + fmtMB(p.file.size) + '</span></div>';
    }).join('');
    const catRows = CATS.map(c => {
        const done = counts[c] > 0;
        return '<div class="step"><span class="step-n"' + (done ? ' style="background:var(--rc-teal);color:#fff"' : '') + '>' + (done ? counts[c] : '&middot;') + '</span>'
            + '<span class="step-t"><b>' + c + '</b> &mdash; ' + (done ? 'added' : 'not added yet') + '</span></div>';
    }).join('');
    const pickBlock = FS_DIR
        ? '<button class="btn" id="b-pick-dir">Pick the whole Media folder</button>'
          + '<p class="fine">Choose a folder, then grant access. Recova collects the files inside it, including subfolders. Choose <b>WhatsApp Business &rsaquo; Media</b> (on some phones it sits inside <b>Android &rsaquo; media &rsaquo; com.whatsapp.w4b &rsaquo; WhatsApp Business</b>).</p>'
          + '<button class="btn btn-ghost" id="b-pick">' + (has ? 'Add more files yourself' : 'Or select the files yourself') + '</button>'
        : '<button class="btn" id="b-pick">' + (has ? 'Add more media' : 'Select media') + '</button>'
          + '<button class="btn btn-ghost" id="b-pick-folder">Try folder selection</button>'
          + '<p class="fine">Whole-folder access is not available through this browser API. Try the folder button, use file selection below, or update Chrome. Device storage rules can still limit access.</p>';
    app.innerHTML = '<div class="stage"><div class="body">'
        + '<p class="kicker">Real rescue &middot; runs on the affected phone</p>'

        + '<p class="kicker" id="scan-kicker">Demo &middot; Step 3 of 3 &middot; Rescuing from Ada&rsquo;s phone</p>'
        + '<div class="scanline"><span class="scanline-text">Ada&rsquo;s phone &rsaquo; Android &rsaquo; media &rsaquo; com.whatsapp.w4b &rsaquo; Media</span></div>'
        + '<div class="bar"><span class="bar-fill" id="scan-bar" style="width:0%"></span></div>'
        + '<div class="counters" id="scan-counters"></div><div class="grid" id="scan-grid"></div>'
        + '<div id="scan-foot"><button class="quiet" id="b-skip">0 files found so far. Tap to skip ahead.</button></div>'
        + '</div>' + FOOT + '</div>';
    const bar = document.getElementById('scan-bar'), counters = document.getElementById('scan-counters'), grid = document.getElementById('scan-grid'), skip = document.getElementById('b-skip');
    let done = false;
    const start = Date.now(), DURATION = 6800;
    function finish() {
        if (done) return;
        done = true; clearTimers(); draw(1);
        document.getElementById('scan-kicker').textContent = 'Demo · Rescue complete';
        document.getElementById('scan-foot').innerHTML = '<div class="found">' + CHECK + '<div class="found-title">' + TOTAL + ' files pulled across, every one intact</div><button class="btn" id="b-review">See the rescued files</button></div>';
        document.getElementById('b-review').onclick = () => go('results');
    }
    function draw(p) {
        const e = ease(p);
        const c = { photos: Math.floor(TOTALS.photos * e), videos: Math.floor(TOTALS.videos * e), documents: Math.floor(TOTALS.documents * e), voice: Math.floor(TOTALS.voice * e) };
        const foundN = c.photos + c.videos + c.documents + c.voice;
        bar.style.width = Math.round(e * 100) + '%';
        counters.innerHTML = '<span><b>' + c.photos + '</b> photos</span><span><b>' + c.videos + '</b> videos</span><span><b>' + c.documents + '</b> documents</span><span><b>' + c.voice + '</b> voice notes</span>';
        const tilesShown = Math.min(MEDIA_TILES.length, Math.floor(Math.max(0, e - 0.08) * (MEDIA_TILES.length + 3)));
        if (grid.children.length < tilesShown) for (let i = grid.children.length; i < tilesShown; i++) grid.insertAdjacentHTML('beforeend', tileHTML(MEDIA_TILES[i], false));
        if (!done) skip.textContent = foundN + ' files found so far. Tap to skip ahead.';
    }
    skip.onclick = finish;
    every(() => { const p = Math.min(1, (Date.now() - start) / DURATION); if (p >= 1) { finish(); return; } draw(p); }, 60);
}
function renderResults() {
    app.innerHTML = '<div class="stage"><div class="body">'
        + '<p class="kicker">Demo &middot; Rescued from the banned line</p><h2 class="h2">Everything Ada thought she lost</h2>'
        + '<div class="counters counters-flat"><span><b>' + TOTALS.photos + '</b> photos</span><span><b>' + TOTALS.videos + '</b> videos</span><span><b>' + TOTALS.documents + '</b> documents</span><span><b>' + TOTALS.voice + '</b> voice notes</span></div>'
        + '<div class="grid grid-big">' + MEDIA_TILES.map(t => tileHTML(t, true)).join('') + '<figure class="tile tile-more big"><span>+' + (TOTAL - MEDIA_TILES.length) + '</span><figcaption>more files</figcaption></figure></div>'
        + '<p class="p">Now move everything somewhere the ban can never reach.</p>'
        + '<div class="dest"><button class="btn" id="b-drive">Save to Google Drive</button><button class="btn btn-ghost" id="b-phone">Save to this phone</button></div>'
        + '</div>' + FOOT + '</div>';
    document.getElementById('b-drive').onclick = () => { dest = 'drive'; go('saving'); };
    document.getElementById('b-phone').onclick = () => { dest = 'files'; go('saving'); };
}
function renderSaving() {
    app.innerHTML = '<div class="stage"><div class="body center">'
        + '<p class="kicker">Demo &middot; ' + (dest === 'drive' ? 'Saving to Google Drive' : 'Saving to this phone') + '</p>'
        + '<div class="savenum" id="save-num">0<span> / ' + TOTAL + '</span></div>'
        + '<div class="bar"><span class="bar-fill" id="save-bar" style="width:0%"></span></div>'
        + '<p class="fine">files moved to safety</p></div>' + FOOT + '</div>';
    const num = document.getElementById('save-num'), bar = document.getElementById('save-bar');
    const start = Date.now(), DURATION = 3400;
    every(() => {
        const p = Math.min(1, (Date.now() - start) / DURATION), e = ease(p);
        num.innerHTML = Math.floor(TOTAL * e) + '<span> / ' + TOTAL + '</span>';
        bar.style.width = Math.round(e * 100) + '%';
        if (p >= 1) { clearTimers(); later(() => go('saved'), 500); }
    }, 60);
}
function renderSaved() {
    app.innerHTML = '<div class="stage"><div class="body center">' + CHECK_BIG
        + '<h2 class="h2">All ' + TOTAL + ' files are safe.</h2>'
        + '<p class="p">Ada&rsquo;s whole catalogue, every invoice and every voice note is now ' + (dest === 'drive' ? 'in her Google Drive' : 'on this phone') + '. The ban took the account. It did not take a single photo.</p>'
        + '<button class="btn" id="b-truth2">What Recova can and can&rsquo;t do</button><button class="quiet" id="b-again">Back to the start</button>'
        + '</div>' + FOOT + '</div>';
    document.getElementById('b-truth2').onclick = () => go('truth');
    document.getElementById('b-again').onclick = () => go('welcome');
}
function renderTruth() {
    app.innerHTML = '<div class="stage"><div class="body">'
        + '<p class="kicker">The honest version</p><h2 class="h2">What Recova can and can&rsquo;t do</h2>'
        + '<div class="truth-group"><div class="truth-label">1. Where the media really is</div>'
        + '<p class="p">It was never inside the banned account. WhatsApp and WhatsApp Business save every downloaded photo, video and document in the phone&rsquo;s own storage: under Internal storage &rsaquo; WhatsApp Business &rsaquo; Media on many phones, or Android &rsaquo; media &rsaquo; com.whatsapp.w4b (com.whatsapp for the regular app) on newer ones. A ban locks the account, not that folder. Where the browser and Android allow folder access, Recova can collect that folder recursively; on an older one, the owner adds each folder&rsquo;s files. The same files can always be copied free in any file manager.</p></div>'
        + '<div class="truth-group"><div class="truth-label">2. What no app can do</div>'
        + '<p class="p">Chats and backups stay locked while the number is banned. WhatsApp&rsquo;s own ban page says a backup can only be reached after the number is unbanned, and the only way back is the Request review button in the app. If there is no button, the ban is final. No app can pair with another phone over hotspot and read its folders; that part of the class demo is theatre.</p>'
        + '<p class="p">Source: <a class="textlink" href="https://faq.whatsapp.com/465883178708358/?locale=en_US" target="_blank" rel="noopener">WhatsApp Help Center, about account bans</a></p></div>'
        + '<div class="truth-group"><div class="truth-label">3. About that $7</div>'
        + '<p class="p">The payment screen exists only in the simulated demo. Apps like it really do charge, but paying only ever buys copies of files the owner could copy free &mdash; and anyone who charges to recover chats or unban a number is a scammer.</p>'
        + '<div class="callout"><b>Never pay for chat recovery</b><span>No app, technician or hacker can pull chats out of a banned account. They take the money, or the verification code, and hijack the account.</span></div></div>'
        + '<button class="btn" id="b-back">Back to the start</button>'
        + '</div>' + FOOT + '</div>';
    document.getElementById('b-back').onclick = () => go('welcome');
}
go('welcome');
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
